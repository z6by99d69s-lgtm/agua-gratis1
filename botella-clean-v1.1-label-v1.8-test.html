<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bottle3D V1.8 - etiqueta</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden
}
body{
  font-family:Inter,system-ui,sans-serif;
  background:#e5edf5;
  color:#0b1f44
}
header{
  padding:16px 20px;
  background:#fff;
  border-bottom:1px solid #dbe3ec
}
.stage{
  position:relative;
  height:calc(100% - 58px);
  touch-action:none;
  cursor:grab
}
canvas{
  display:block;
  width:100%;
  height:100%
}
.pill,.hint{
  position:absolute;
  background:rgba(255,255,255,.95);
  border:1px solid #e2e8f0;
  color:#475569
}
.pill{
  left:16px;
  top:16px;
  padding:9px 12px;
  border-radius:12px;
  font-size:13px
}
.hint{
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  padding:10px 16px;
  border-radius:999px
}
.error{
  color:#b42318
}
</style>
</head>

<body>

<header>
  <strong>Bottle3D V1.8 - etiqueta</strong> · gira 360°
</header>

<div class="stage" id="stage">
  <div class="pill" id="status">Cargando...</div>
  <div class="hint">← drag / swipe →</div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const URL = './botella-clean-v1.1-label-v1.7.glb';

const stage = document.getElementById('stage');
const status = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe5edf5);

const camera = new THREE.PerspectiveCamera(30,1,.01,1000);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

stage.prepend(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const env = new RoomEnvironment();

scene.environment = pmrem.fromScene(env,.045).texture;

env.dispose();

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0xcbd5e1,
    1.35
  )
);

const key = new THREE.DirectionalLight(
  0xffffff,
  2.4
);

key.position.set(4,7,7);
scene.add(key);

const pivot = new THREE.Group();
scene.add(pivot);

let model = null;
let drag = false;
let lastX = 0;

function box(o){
  o.updateMatrixWorld(true);
  return new THREE.Box3().setFromObject(o);
}

function normalizeUp(o){
  o.rotation.set(0,0,0);

  const s = box(o).getSize(
    new THREE.Vector3()
  );

  if(s.x >= s.y && s.x >= s.z){
    o.rotation.z = Math.PI / 2;
  }else if(
    s.z >= s.x &&
    s.z >= s.y
  ){
    o.rotation.x = -Math.PI / 2;
  }

  o.updateMatrixWorld(true);
}

function center(o){
  const c = box(o).getCenter(
    new THREE.Vector3()
  );

  o.position.sub(c);
  o.updateMatrixWorld(true);
}

function frame(){

  if(!model) return;

  const b = box(pivot);
  const s = b.getSize(
    new THREE.Vector3()
  );

  const c = b.getCenter(
    new THREE.Vector3()
  );

  const vf = THREE.MathUtils.degToRad(
    camera.fov
  );

  const a = Math.max(
    stage.clientWidth / stage.clientHeight,
    .1
  );

  const hf =
    2 *
    Math.atan(
      Math.tan(vf/2) * a
    );

  const d = Math.max(
    (s.y/2) / Math.tan(vf/2),
    (Math.max(s.x,s.z)/2) / Math.tan(hf/2)
  ) * 1.35;

  camera.position.set(
    c.x,
    c.y,
    c.z + d
  );

  camera.lookAt(c);

  camera.near = Math.max(
    d/100,
    .01
  );

  camera.far = d * 100;

  camera.updateProjectionMatrix();
}

function resize(){

  const ww = Math.max(
    stage.clientWidth,
    1
  );

  const hh = Math.max(
    stage.clientHeight,
    1
  );

  renderer.setSize(
    ww,
    hh,
    false
  );

  camera.aspect = ww / hh;
  camera.updateProjectionMatrix();

  frame();
}

addEventListener(
  'resize',
  resize
);

resize();

new GLTFLoader().load(

  URL,

  g => {

    model = g.scene;

    model.traverse(o => {

      if(!o.isMesh) return;

      /* PET */
     if(o.name==='geometry_0')o.material=new THREE.MeshPhysicalMaterial({
  color:0xffffff,
  transparent:true,
  opacity:0.28,
  transmission:0.72,
  roughness:0.10,
  metalness:0,
  ior:1.47,
  thickness:0.045,
  clearcoat:0.38,
  clearcoatRoughness:0.06,
  envMapIntensity:1.7,
  side:THREE.DoubleSide
});

      /* AGUA */
      if(o.name === 'water_volume'){
        o.material =
          new THREE.MeshPhysicalMaterial({
            color:0x35c9c5,
            transparent:true,
            opacity:0.62,
            transmission:0.22,
            roughness:0.045,
            metalness:0,
            ior:1.333,
            thickness:0.055,
            clearcoat:0.2,
            clearcoatRoughness:0.05,
            envMapIntensity:1.35,
            side:THREE.DoubleSide
          });
      }

    });

    normalizeUp(model);
    center(model);

    pivot.add(model);

    frame();

    status.textContent =
      'V1.8 · PET visible · agua turquesa · etiqueta 85% · frente 01/02 · trasera 03/04';
  },

  undefined,

  e => {

    console.error(e);

    status.textContent =
      'Error cargando ' + URL;

    status.classList.add('error');
  }

);

stage.addEventListener(
  'pointerdown',
  e => {
    drag = true;
    lastX = e.clientX;
    stage.setPointerCapture(
      e.pointerId
    );
  }
);

stage.addEventListener(
  'pointermove',
  e => {

    if(!drag || !model) return;

    const dx =
      e.clientX - lastX;

    lastX = e.clientX;

    pivot.rotation.y += dx * 0.009;
  }
);

function stop(e){

  drag = false;

  try{
    stage.releasePointerCapture(
      e.pointerId
    );
  }catch{}
}

stage.addEventListener(
  'pointerup',
  stop
);

stage.addEventListener(
  'pointercancel',
  stop
);

(function loop(){

  requestAnimationFrame(loop);

  renderer.render(
    scene,
    camera
  );

})();

</script>

</body>
</html>
