<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agua Gratis — Home + Bottle3D V1.8</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
  #site{width:100%;height:100%;border:0;display:block}
  #status{
    position:fixed;
    left:14px;
    top:14px;
    z-index:9999;
    padding:9px 12px;
    border-radius:12px;
    background:rgba(255,255,255,.96);
    border:1px solid #e2e8f0;
    color:#475569;
    font:600 13px Inter,system-ui,sans-serif;
    box-shadow:0 8px 24px rgba(11,31,68,.08)
  }
  #status.ok{color:#0b1f44}
  #status.error{color:#b42318}
</style>
</head>
<body>
<iframe id="site" src="./index.html" title="Agua Gratis Home"></iframe>
<div id="status">Cargando Home + Bottle3D…</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = './botella-clean-v1.1-label-v1.8.glb';
const iframe = document.getElementById('site');
const status = document.getElementById('status');

function setStatus(text, cls=''){
  status.textContent = text;
  status.className = cls;
}

function box(o){
  o.updateMatrixWorld(true);
  return new THREE.Box3().setFromObject(o);
}

function fit(camera, model, host){
  const b = box(model);
  const s = b.getSize(new THREE.Vector3());
  const c = b.getCenter(new THREE.Vector3());

  const vf = THREE.MathUtils.degToRad(camera.fov);
  const aspect = Math.max(host.clientWidth / Math.max(host.clientHeight,1), .1);
  const hf = 2 * Math.atan(Math.tan(vf/2) * aspect);

  const d = Math.max(
    (s.y/2) / Math.tan(vf/2),
    (Math.max(s.x,s.z)/2) / Math.tan(hf/2)
  ) * 1.18;

  camera.position.set(c.x, c.y, c.z + d);
  camera.lookAt(c);
  camera.near = Math.max(d/100, .01);
  camera.far = d * 100;
  camera.updateProjectionMatrix();
}

function installBottle(){
  const doc = iframe.contentDocument || iframe.contentWindow.document;

  const hero = doc.querySelector('.hero-product');
  if(!hero){
    setStatus('No encontré .hero-product en index.html','error');
    return;
  }

  const old = hero.querySelector('.bottle-placeholder');
  if(old) old.style.display = 'none';

  const oldShadow = hero.querySelector('.bottle-shadow');
  if(oldShadow) oldShadow.style.display = 'none';

  let host = hero.querySelector('#bottle3d-home-test');
  if(!host){
    host = doc.createElement('div');
    host.id = 'bottle3d-home-test';
    host.style.cssText =
      'position:relative;width:min(100%,560px);height:620px;z-index:4;display:flex;align-items:center;justify-content:center;';
    hero.appendChild(host);
  }

  const canvasHost = document.createElement('div');
  canvasHost.style.cssText =
    'position:relative;width:100%;height:100%;touch-action:none;cursor:grab;';
  host.appendChild(canvasHost);

  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'display:block;width:100%;height:100%;';
  canvasHost.appendChild(canvas);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(28,1,.01,1000);

  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    alpha:true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;

  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = new RoomEnvironment();
  scene.environment = pmrem.fromScene(env,.04).texture;
  env.dispose();

  scene.add(new THREE.HemisphereLight(0xffffff,0xcbd5e1,1.25));
  const key = new THREE.DirectionalLight(0xffffff,2.1);
  key.position.set(4,7,7);
  scene.add(key);

  const pivot = new THREE.Group();
  scene.add(pivot);

  let model = null;
  let dragging = false;
  let lastX = 0;

  function resize(){
    const w = Math.max(canvasHost.clientWidth,1);
    const h = Math.max(canvasHost.clientHeight,1);
    renderer.setSize(w,h,false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
    if(model) fit(camera,pivot,canvasHost);
  }

  new ResizeObserver(resize).observe(canvasHost);

  canvasHost.addEventListener('pointerdown',e=>{
    dragging = true;
    lastX = e.clientX;
    canvasHost.setPointerCapture(e.pointerId);
  });

  canvasHost.addEventListener('pointermove',e=>{
    if(!dragging || !model) return;
    const dx = e.clientX-lastX;
    lastX = e.clientX;
    pivot.rotation.y += dx*.0085;
  });

  const stop=e=>{
    dragging=false;
    try{canvasHost.releasePointerCapture(e.pointerId)}catch{}
  };
  canvasHost.addEventListener('pointerup',stop);
  canvasHost.addEventListener('pointercancel',stop);

  new GLTFLoader().load(
    MODEL_URL,
    gltf=>{
      model = gltf.scene;
      model.traverse(o=>{
        if(o.isMesh) o.castShadow = false;
      });
      pivot.add(model);
      resize();
      setStatus('Bottle3D V1.8 integrado en Home','ok');
    },
    undefined,
    err=>{
      console.error(err);
      setStatus('Error cargando Bottle3D V1.8','error');
    }
  );

  (function loop(){
    requestAnimationFrame(loop);
    renderer.render(scene,camera);
  })();
}

iframe.addEventListener('load',()=>{
  try{
    installBottle();
  }catch(err){
    console.error(err);
    setStatus('No se pudo integrar Bottle3D en Home','error');
  }
});
</script>
</body>
</html>
